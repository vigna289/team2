name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:


jobs:

  backend-build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      - name: Coverage gate
        run: |
          cd backend
          ./mvnw verify