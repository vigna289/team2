<!doctype html>
<!--
============================================================================
Flexbox page shell (sidebar + header + main + footer) — TICKET-ADV098
Semantic HTML5 (header/nav/main/section/article/aside/footer)
ARIA roles + aria-live for the trade feed — TICKET-ADV101
Anti-FOUC theme script (must load BEFORE the stylesheet) — TICKET-ADV100
============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- TICKET-ADV100 — must run BEFORE the stylesheet link so the correct
       theme attribute is set before first paint (no white-flash / FOUC). -->
  <script>
    (function () {
      var stored = localStorage.getItem('reconx-theme') || 'light';
      document.documentElement.setAttribute('data-theme', stored);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-shell">

  <header class="app-header" role="banner">
    <h1 class="app-header__title">ReconX</h1>
    <nav class="app-header__nav" aria-label="Main navigation">
      <a href="dashboard.html" aria-current="page">Dashboard</a>
      <a href="trades.html">Trades</a>
      <a href="recon.html">Recon</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle light/dark theme" aria-pressed="false">🌗</button>
  </header>

  <div class="app-body">
    <aside class="app-sidebar" role="complementary">
      <h2>Quick filters</h2>
      <ul>
        <li><a href="#">All trades</a></li>
        <li><a href="#">Open breaks</a></li>
        <li><a href="#">Today</a></li>
      </ul>
    </aside>

    <main class="app-main" role="main">
      <section aria-labelledby="kpi">
        <h2 id="kpi">Today at a glance</h2>
        <div class="dashboard-grid">
          <article class="stat-card"><h3>Trades</h3><p>120</p></article>
          <article class="stat-card"><h3>Matched</h3><p>105</p></article>
          <article class="stat-card stat-card--warn"><h3>Open breaks</h3><p>15</p></article>
        </div>
      </section>

      <!-- TICKET-ADV102 — pulsing danger alert (visible demo of the pulse keyframe) -->
      <div class="alert alert--danger" role="alert">
        ⚠ Unmatched trades detected — 3 breaks require attention
      </div>

      <section aria-labelledby="feed">
        <h2 id="feed">Live trade feed</h2>
        <span id="sse-status" class="sse-status">Connecting…</span>
        <!-- aria-live so screen readers announce new trades -->
        <div id="trade-feed" class="trade-feed" role="status" aria-live="polite" aria-atomic="false"></div>
      </section>
    </main>
  </div>

  <footer class="app-footer" role="contentinfo">
    <small>ReconX TDI 2026 · static dashboard (Day 7)</small>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/sse.js"></script>
</body>
</html>
